name: Build Ruyi Firmware

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        board: [k3, unmatched]
        target: [DEBUG, RELEASE]
    env:
      BOARD: ${{ matrix.board }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install build dependencies
        run: sudo bash ci/install-deps.sh
      - name: Build firmware
        run: make BOARD="$BOARD" TARGET="$TARGET" package
      - name: Archive firmware
        id: archive
        shell: bash
        run: |
          version="${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME//\//-}"
          fi
          name="ruyifirmware-${BOARD}-${version}-${TARGET,,}"
          mv "dist/$BOARD/$TARGET" "dist/$name"
          tar -cJf "dist/$name.tar.xz" -C dist "$name"
          printf 'path=%s\n' "dist/$name.tar.xz" >> "$GITHUB_OUTPUT"
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ruyifirmware-${{ matrix.board }}-${{ matrix.target }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download all firmware packages
        uses: actions/download-artifact@v8
        with:
          pattern: ruyifirmware-*
          path: release
          merge-multiple: true
      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          name: Ruyi Firmware ${{ github.ref_name }}
          files: release/*.tar.xz
          fail_on_unmatched_files: true
          prerelease: true
