# SPDX-License-Identifier: MIT
# Premier P550: FT4232 channel A is SoC JTAG, channel C is the console.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 0
ftdi layout_init 0x0808 0x0a1b
ftdi layout_signal nSRST -oe 0x0200
ftdi layout_signal nTRST -data 0x0100 -oe 0x0100
ftdi layout_signal LED -data 0x0800
transport select jtag
adapter speed 1000
reset_config none
bindto 127.0.0.1

jtag newtap eic7700 cpu -irlen 5 -expected-id 0x00000913
set eic7700_harts {0 1 2 3}
foreach hart $eic7700_harts {
    target create eic7700.cpu$hart riscv -chain-position eic7700.cpu -coreid $hart
}
# Keep targets independent. The loader must finish and verify each hart's
# cache handoff before any hart starts coreboot and overwrites the stub.

# ROM UART recovery initializes DDR before releasing the main cores.
# Reset the SoC through the BMC. Do not reset live DDR through ndmreset.
riscv set_mem_access progbuf sysbus abstract
