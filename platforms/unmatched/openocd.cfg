# SPDX-License-Identifier: MIT
# HiFive Unmatched: FT2232 channel A is JTAG; channel B is the UART.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x001b
adapter speed 1000
transport select jtag
bindto 127.0.0.1

jtag newtap fu740 cpu -irlen 5 -expected-id 0x20000913
set fu740_harts {0 1 2 3 4}
foreach hart $fu740_harts {
    target create fu740.cpu$hart riscv -chain-position fu740.cpu -coreid $hart
}
# Keep targets independent. OpenOCD 0.12 cannot disable RISC-V SMP
# grouping while a checksum or flash algorithm runs on the working hart.
proc fu740_halt_all {} {
    set errors {}
    foreach hart $::fu740_harts {
        if {[catch {
            targets fu740.cpu$hart
            halt
        } reason]} {
            lappend errors "fu740.cpu$hart: $reason"
        }
    }
    targets fu740.cpu1
    if {[llength $errors]} {
        error [join $errors "\n"]
    }
}

proc fu740_resume_all {} {
    # Start the boot hart last, after the other harts can join its barriers.
    foreach hart $::fu740_harts {
        if {$hart != 1} {
            targets fu740.cpu$hart
            resume
        }
    }
    targets fu740.cpu1
    resume
}

proc fu740_guard {script} {
    if {[catch {uplevel 1 $script} reason]} {
        # An algorithm can fail after resuming its working hart. Attempt
        # every halt even if one hart is unresponsive, and keep both errors.
        if {[catch {fu740_halt_all} halt_error]} {
            append reason "\nCould not halt all harts:\n$halt_error"
        }
        error $reason
    }
}

# prepare-ddr.tcl configures the working hart and its DRAM work area.
# Specify QSPI0 explicitly: the TAP ID alone does not identify its address.
flash bank spi0 fespi 0x20000000 0 0 0 fu740.cpu1 0x10040000

proc fu740_spi_probe {} {
    # FU740 QSPI0 FCTRL and FFMT register fields.
    set fctrl 0x10040060
    set ffmt 0x10040064
    set ffmt_cmd_enable 1
    set ffmt_addr_len_shift 1
    set ffmt_cmd_code_shift 16
    set read4_opcode 0x13

    fu740_halt_all
    riscv set_mem_access progbuf sysbus abstract
    flash probe 0

    # The board's IS25WP256D needs four address bytes above 16 MiB.
    # OpenOCD 0.12 fespi uses the existing memory mapping for reads and
    # verification. Select the dedicated READ4 (0x13) instruction without
    # changing the flash chip's address mode, which the boot ROM relies on.
    mww $fctrl 0
    mww $ffmt [expr {$ffmt_cmd_enable | (4 << $ffmt_addr_len_shift) |
                    ($read4_opcode << $ffmt_cmd_code_shift)}]
    mww $fctrl 1
    flash banks
}
