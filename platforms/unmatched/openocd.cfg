# SPDX-License-Identifier: MIT
# HiFive Unmatched: FT2232 channel A is JTAG; channel B is the UART.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x001b
adapter speed 1000
transport select jtag
bindto 127.0.0.1

jtag newtap fu740 cpu -irlen 5 -expected-id 0x20000913
for {set hart 0} {$hart < 5} {incr hart} {
    target create fu740.cpu$hart riscv -chain-position fu740.cpu -coreid $hart
}
target smp fu740.cpu0 fu740.cpu1 fu740.cpu2 fu740.cpu3 fu740.cpu4

# L2 LIM is available before DDR initialization. Run the flash algorithm
# there, as in SiFive's freedom-e-sdk Unmatched configuration.
fu740.cpu0 configure -work-area-phys 0x08000000 \
    -work-area-size 0x2710 -work-area-backup 1

# Specify QSPI0 explicitly: the TAP ID alone does not identify its address.
flash bank spi0 fespi 0x20000000 0 0 0 fu740.cpu0 0x10040000

proc fu740_spi_probe {} {
    # FU740 QSPI0 FCTRL and FFMT register fields.
    set fctrl 0x10040060
    set ffmt 0x10040064
    set ffmt_cmd_enable 1
    set ffmt_addr_len_shift 1
    set ffmt_cmd_code_shift 16
    set read4_opcode 0x13

    halt
    targets fu740.cpu0
    riscv set_mem_access progbuf sysbus abstract
    flash probe 0

    # The board's IS25WP256D needs four address bytes above 16 MiB.
    # OpenOCD 0.12 fespi uses the existing memory mapping for reads and
    # verification. Select the dedicated READ4 (0x13) instruction without
    # changing the flash chip's address mode, which the boot ROM relies on.
    mww $fctrl 0
    mww $ffmt [expr {$ffmt_cmd_enable | (4 << $ffmt_addr_len_shift) |
                    ($read4_opcode << $ffmt_cmd_code_shift)}]
    mww $fctrl 1
    flash banks
}
